# ============================================================
# Business-Jordan - HAProxy load balancer (Milestone C)
# Flow: Nginx (443, TLS) -> HAProxy (127.0.0.1:8080) -> 2 Express instances
# ============================================================

global
    log /dev/log local0          # send HAProxy logs to the system logger (rsyslog)
    maxconn 2048                 # max simultaneous connections
    user haproxy
    group haproxy
    daemon                       # run in the background

defaults
    mode http                    # layer 7: HAProxy understands HTTP requests
    log global
    option httplog               # detailed HTTP log lines
    option forwardfor          # pass the real client IP to the app (X-Forwarded-For)
    timeout connect 5s           # max time to connect to a backend
    timeout client  30s          # max idle time on the client side
    timeout server  30s          # max time waiting for a backend reply

# Entry point - only reachable from this machine; Nginx forwards here
frontend bj_front
    bind 127.0.0.1:8080
    default_backend bj_app_servers

# The pool of app instances
backend bj_app_servers
    balance roundrobin           # take turns between instances
    option httpchk GET /api/health   # health check: remove an instance if /health fails
    server app1 127.0.0.1:3000 check   # PM2 instance bj-app-1
    server app2 127.0.0.1:3001 check   # PM2 instance bj-app-2

# Stats page (local only) - view with: curl http://127.0.0.1:8404/stats
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
