# Nginx config for Business-Jordan (COMP 1350 Milestone A)

# Block 1: catch plain HTTP and send it to HTTPS
server {
    listen 80;
    server_name 158.23.86.240;
    return 301 https://$host$request_uri;   # permanent redirect to HTTPS
}

# Block 2: the real site, over HTTPS
server {
    listen 443 ssl;
    server_name 158.23.86.240;

    # Self-signed certificate from Step 2a
    ssl_certificate     /etc/ssl/certs/business-jordan.crt;
    ssl_certificate_key /etc/ssl/private/business-jordan.key;
    ssl_protocols TLSv1.2 TLSv1.3;          # only modern, secure TLS versions

    location / {
        proxy_pass http://127.0.0.1:3000;            # forward to Express (local only)
        proxy_http_version 1.1;
        proxy_set_header Host $host;                  # keep original host
        proxy_set_header X-Real-IP $remote_addr;      # pass visitor's real IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # tells Express it was https
    }
}
