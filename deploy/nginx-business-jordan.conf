server {
    if ($host = milestonea.mexicocentral.cloudapp.azure.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name milestonea.mexicocentral.cloudapp.azure.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name milestonea.mexicocentral.cloudapp.azure.com;

    ssl_certificate /etc/letsencrypt/live/milestonea.mexicocentral.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milestonea.mexicocentral.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
