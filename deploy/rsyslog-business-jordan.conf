# ============================================================
# Business-Jordan - centralized logging (Milestone C)
# Collects logs from BOTH app instances + HAProxy into ONE file
# ============================================================

# imfile = lets rsyslog watch plain log files
module(load="imfile")

# Watch every PM2 log file (app instances write here)
input(type="imfile"
      File="/var/log/bj-pm2/*.log"
      Tag="bj-app:"
      Severity="info"
      Facility="local3"
      addMetadata="on")

# Line format: time, host, source tag, which file it came from, message
template(name="BJFormat" type="string"
         string="%timegenerated% %HOSTNAME% %syslogtag% %$!metadata!filename% %msg%\n")

# Send app + HAProxy logs to the single collector file
if $syslogtag startswith "bj-app" or $programname == "haproxy" then {
    action(type="omfile" file="/var/log/business-jordan.log" template="BJFormat")
}
